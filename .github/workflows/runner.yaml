name: Run all jobs
run-name: "Run all jobs ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  website:
    name: Website
    uses: ./.github/workflows/website.yaml

  linux:
    name: Linux
    uses: ./.github/workflows/linux.yaml

  macos:
    name: MacOS
    uses: ./.github/workflows/macos.yaml
